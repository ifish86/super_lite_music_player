# upmpdcli - UPnP/OpenHome renderer front end for MPD.
#
# Replaces the upstream upmpdcli.conf-dist the package installs. The
# full option list is in upmpdcli.conf(5); only the settings this image
# actually needs are here, so that what is set is visible rather than
# buried in three hundred commented-out lines.
#
# This file is in the read-only image. To change something on a running
# unit without a rebuild, the persistent copy wins:
#     /data/upmpdcli.conf
# See /etc/init.d/S99upmpdcli.

# What shows up in a control point's renderer list.
friendlyname = BDP-1

# MPD is on this box and is the only thing that makes sound. upmpdcli
# never touches ALSA itself: it translates UPnP into MPD commands, so the
# S/PDIF path and mpd.conf are entirely unaffected by any of this.
mpdhost = localhost
mpdport = 6600

# Log to syslog, which on this image means /var/log/messages on tmpfs.
# 2 is errors and warnings. Raise to 4 when a control point will not talk
# to the unit and you need to see the SSDP traffic.
logfilename = syslog
loglevel = 2

# OpenHome services on top of plain UPnP AV. This is the half that
# matters for audio: the renderer keeps its own playlist, which is what
# makes gapless work and what Linn Kazoo, Lumin and BubbleUPnP actually
# drive. Plain UPnP AV hands over one track at a time and cannot be
# gapless by construction.
openhome = 1

# Cache and state. /var/cache is a skeleton symlink to /tmp, so this is
# already tmpfs and costs the CF card nothing. There is nothing here
# worth keeping across a reboot - it is rebuilt from MPD.
cachedir = /var/cache/upmpdcli

# No media server, no Songcast, no streaming service plugins. The
# renderer is the whole job: proposal 3.2 puts Tidal, Qobuz and Spotify
# out of scope permanently, and the point of UPnP here is that the
# control point deals with all of that and pushes the result at us.
# Those plugins also want Python, which this image does not have.
plgmicrophone = 0
