# Phase 1 MPD config. Deliberately minimal.
# Started by Buildroot's own /etc/init.d/S95mpd.

# USB drives mount as /media/<label>, one directory per drive. MPD sees
# each as a top-level folder and rescans when one appears - see
# /usr/sbin/slmp-usb-mount. NFS and SMB shares will mount here too.
music_directory     "/media"
# Everything MPD writes goes on the data partition. It is the same
# filesystem across a reboot, so the database is not rebuilt from
# scratch every time and playback resumes where it stopped.
playlist_directory  "/data/mpd/playlists"
db_file             "/data/mpd/database"
state_file          "/data/mpd/state"
sticker_file        "/data/mpd/sticker.sql"
pid_file            "/var/run/mpd.pid"

bind_to_address     "0.0.0.0"
port                "6600"
# /var/log is a symlink to /tmp, so this lands on tmpfs.
log_file            "/var/log/mpd.log"

# The database survives reboots now that it is on /data. If /data could
# not be mounted, S03data puts a tmpfs there instead and MPD silently
# goes back to rebuilding at every boot - slow, but it still plays.

# 256MB of RAM. Do not let the buffer get greedy.
audio_buffer_size   "2048"

# Juli@ S/PDIF coax. Card 0, DEVICE 1 - the device number matters as
# much as the card number here. `aplay -l` on a real unit reports:
#
#   card 0: Juli [ESI Juli@], device 0: ICE1724 [ICE1724]
#   card 0: Juli [ESI Juli@], device 1: ICE1724 IEC958 [ICE1724 IEC958]
#
# Device 0 is the analog PCM. Device 1 is the dedicated IEC958 path,
# which is what feeds the coax socket this product actually uses. With
# hw:0,0 everything looks perfectly healthy - MPD reports "play",
# pcm0p goes to RUNNING and its hw_ptr advances - and no sound comes out
# of the digital output, because the audio is going to the analog jacks.
#
# HD-audio is compiled out of the kernel so nothing competes for card
# index 0; if that changes, recheck the card number too.
audio_output {
    type        "alsa"
    name        "Julia SPDIF"
    device      "hw:0,1"
    mixer_type  "none"
}

