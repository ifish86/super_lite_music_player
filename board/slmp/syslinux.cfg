DEFAULT slmp
PROMPT 0
TIMEOUT 10

LABEL slmp
  KERNEL /bzImage
  # No console= on ttyS0: that UART belongs to the front panel.
  # Add it only when the panel is physically disconnected.
  #
  # The watchdog needs two parameters, not one, and this took a real unit
  # to work out.
  #
  # acpi_enforce_resources=lax comes first. ACPI claims the CS5535's ACPI
  # BAR (9c00-9c3f) before cs5535-mfd gets there, so registering its
  # sub-devices hits acpi_check_resource_conflict() and returns -EBUSY
  # under the default STRICT policy. mfd_add_devices() is atomic, so that
  # one conflict takes cs5535-mfgpt down with it. lax downgrades the
  # conflict to a printk.
  #
  # That was necessary and not sufficient. With lax alone, a BDP-1 gets
  # as far as "cs5535-mfd: 4 devices registered" and cs5535-mfgpt
  # reserving [io 0x6200-0x623f], and then says:
  #
  #   cs5535-mfgpt cs5535-mfgpt: 0 MFGPT timers available
  #   geodewdt: No timers were available
  #
  # and /dev/watchdog is never created. scan_timers() in
  # drivers/misc/cs5535-mfgpt.c counts a timer as free only if its
  # MFGPT_SETUP_SETUP bit is clear, and this BIOS has configured all
  # eight. mfgptfix is the driver's own workaround for exactly that BIOS
  # behaviour: 1 resets the timers using an undocumented bit, 2 does a
  # soft reset by unconfiguring them all and takes every timer whatever
  # its SETUP bit says. 1 is the gentler of the two, so start there.
  #
  # If /dev/watchdog is still missing, try mfgptfix=2. Both forcibly take
  # timers the BIOS had set up for its own purposes, which on a machine
  # whose BIOS nobody has the source to is a calculated risk rather than
  # a free one.
  APPEND root=/dev/sda2 ro rootwait console=tty0 acpi_enforce_resources=lax cs5535_mfgpt.mfgptfix=1
