DEFAULT slmp
PROMPT 0
TIMEOUT 10

LABEL slmp
  KERNEL /bzImage
  # No console= on ttyS0: that UART belongs to the front panel.
  # Add it only when the panel is physically disconnected.
  # acpi_enforce_resources=lax is what makes the watchdog work.
  #
  # ACPI claims the CS5535's ACPI BAR (9c00-9c3f) first, so when
  # cs5535-mfd registers its sub-devices, acpi_check_resource_conflict()
  # returns -EBUSY under the default STRICT policy. mfd_add_devices() is
  # atomic, so that one conflict takes cs5535-mfgpt down with it and
  # geodewdt then reports "No timers were available" and never creates
  # /dev/watchdog. lax downgrades the conflict to a printk.
  APPEND root=/dev/sda2 ro rootwait console=tty0 acpi_enforce_resources=lax
