
# --- super_lite_music_player -------------------------------------------
#
# Appended to Buildroot's mdev.conf by board/slmp/post-build.sh rather
# than forking the whole file, so upstream's device permissions keep
# tracking Buildroot.
#
# sd[b-z] only. The CompactFlash card is sda on the CS5536 PATA channel,
# and automounting the disk the system is running from would be a fine
# way to lose it. Bare disks (sdb) are ignored too: only partitions are
# mounted, so a drive with no partition table is left alone.
sd[b-z][1-9][0-9]?	root:root 660 */usr/sbin/slmp-usb-mount
