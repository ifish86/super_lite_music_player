image boot.vfat {
  vfat {
    label = "SLMPBOOT"
    extraargs = "-F 32"
    # `files` is an option of the vfat section, not of the image. At
    # image level genimage rejects it: "no such option 'files'".
    files = { "bzImage", "syslinux.cfg", "ldlinux.c32" }
  }
  size = 64M
}

image sdcard.img {
  hdimage {
    partition-table-type = "mbr"
  }

  partition boot {
    partition-type = 0xC
    bootable = "true"
    image = "boot.vfat"
    offset = 1M
  }

  partition rootfs {
    partition-type = 0x83
    image = "rootfs.ext2"
    # Phase 4 adds the B slot as partition 4, in the space S03data
    # deliberately leaves free at the end of the card.
  }

  # Persistent data. Deliberately has no image and no filesystem: it is
  # 8 MB of reserved space in the partition table and nothing else.
  #
  # /etc/init.d/S03data grows this entry to fill the card on first boot
  # and then makes an ext4 in it. Shipping it at its final size instead
  # would mean an image the size of the largest card anyone might use,
  # and shipping a filesystem in it would mean resizing one rather than
  # creating one, which needs resize2fs on the target for no gain.
  partition data {
    partition-type = 0x83
    size = 8M
  }
}
